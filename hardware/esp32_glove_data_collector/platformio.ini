[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit BMI160 Library@2.2.1
    bblanchon/ArduinoJson@6.21.3
    arduino-libraries/WiFi@2.0.0
    arduino-libraries/WebServer@2.0.0
    arduino-libraries/SPIFFS@2.0.0

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; Configuración de particiones para SPIFFS
board_build.partitions = huge_app.csv

; Optimización de memoria
build_type = release
